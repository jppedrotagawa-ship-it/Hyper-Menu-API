<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyper Menu - Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background:
      linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
      radial-gradient(ellipse at 30% 20%, #2b3a55 0%, #0a0e18 70%);
    color: #fff;
    overflow: hidden;
    user-select: none;
  }
  #hint {
    position: fixed; top: 14px; left: 0; right: 0; text-align: center;
    font-size: 13px; color: #9fb3cc; letter-spacing: 1px;
  }
  #stage { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }

  .menu {
    width: 560px;
    background: rgba(4, 6, 12, 0.78);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.45), 0 18px 60px rgba(0,0,0,0.7);
  }

  .banner {
    display: block; width: 100%; height: 96px; object-fit: cover;
    border-radius: 18px 18px 0 0;
  }

  .sub {
    height: 36px; display: flex; align-items: center; position: relative;
    background: rgba(56, 189, 248, 0.28);
    border-radius: 12px; margin: 8px 8px 6px;
    padding: 0 12px;
  }
  .sub .name { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
  .sub .dots { margin-left: auto; display: flex; gap: 6px; }
  .sub .dots span { width: 6px; height: 6px; background: rgba(56,189,248,0.35); }
  .sub .dots span.on { background: #38bdf8; box-shadow: 0 0 6px #38bdf8; }

  .mitems { padding: 4px 8px 8px; }
  .mrow {
    height: 34px; display: flex; align-items: center;
    padding: 0 10px; position: relative; margin: 1px 0;
    border-radius: 12px;
    font-size: 14px; color: #cdd6e1;
  }
  .mrow.sel {
    background: rgba(56,189,248,0.33);
    color: #fff;
    box-shadow: 0 0 14px rgba(56,189,248,0.30), 0 0 0 1px rgba(56,189,248,0.22);
  }
  .mrow .lab { flex: 1; white-space: nowrap; overflow: hidden; }
  .mrow .val { font-size: 12px; text-align: right; }
  .wicon { width: 26px; height: 26px; margin-right: 10px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6)); }

  .badge-on  { color: #34d399; }
  .badge-off { color: #8c96aa; }
  .badge-cycle { color: #78b4ff; }
  .badge-go  { color: #cdd6e1; }

  .mfoot {
    display: flex; justify-content: center;
    background: rgba(3, 5, 10, 0.78);
    padding: 6px 14px 8px;
    font-size: 11px; color: #8c9cb3; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div id="hint">PREVIEW - setas: esquerda/direita = pagina, cima/baixo = item, ENTER ativa</div>
  <div id="stage"></div>

<script>
  const CATS = [
    { name: 'Locais', items: [
      { n: 'Godmode', t: 'toggle', v: false }, { n: 'Invisivel', t: 'toggle', v: false },
      { n: 'Sem Ragdoll', t: 'toggle', v: false }, { n: 'Stamina Infinita', t: 'toggle', v: false },
      { n: 'Super Velocidade', t: 'toggle', v: false }, { n: 'Curar', t: 'action' },
      { n: 'Colete', t: 'action' }, { n: 'Limpar Visual', t: 'action' }
    ]},
    { name: 'Arma', items: [
      { n: 'Municao Infinita', t: 'toggle', v: false }, { n: 'Municao Explosiva', t: 'toggle', v: false },
      { n: 'Municao Incendiaria', t: 'toggle', v: false }, { n: 'Pistola', t: 'action', i: 'pistol' },
      { n: 'SMG', t: 'action', i: 'smg' }, { n: 'Fuzil de Assalto', t: 'action', i: 'assaultrifle' },
      { n: 'Sniper', t: 'action', i: 'sniperrifle' }, { n: 'RPG', t: 'action', i: 'rpg' },
      { n: 'Todas as Armas', t: 'action', i: 'carbinerifle' }, { n: 'Remover Armas', t: 'action' }
    ]},
    { name: 'Veiculo', items: [
      { n: 'Reparar', t: 'action' }, { n: 'Ligar Motor', t: 'action' }, { n: 'Pneus Blindados', t: 'toggle', v: false },
      { n: 'Tuning Maximo', t: 'action' }, { n: 'Lavar', t: 'action' }, { n: 'Velocidade Maxima', t: 'toggle', v: false },
      { n: 'Apagar Veiculo', t: 'action' }, { n: 'Spawnar Veiculo', t: 'list' }
    ]},
    { name: 'Teleporte', items: [
      { n: 'Teleporte ao Waypoint', t: 'action' }, { n: 'Hotspots', t: 'list' },
      { n: 'Para o Jogador mais Proximo', t: 'action' }
    ]},
    { name: 'Visual', items: [
      { n: 'Tempo', t: 'cycle', o: ['Ensolarado', 'Limpo', 'Nublado', 'Chuva', 'Nevoeiro', 'Tempestade', 'Neve'], idx: 1 },
      { n: 'Horario', t: 'cycle', o: ['Manha', 'Tarde', 'Entardecer', 'Noite', 'Madrugada'], idx: 3 },
      { n: 'Congelar Tempo', t: 'toggle', v: false }
    ]},
    { name: 'Jogadores', items: [
      { n: 'Todos: Matar', t: 'action' }, { n: 'Todos: Explodir', t: 'action' }, { n: 'Todos: Para Mim', t: 'action' },
      { n: 'Lista de Jogadores', t: 'list' }
    ]},
    { name: 'Diversos', items: [
      { n: 'Aimbot (assistir)', t: 'toggle', v: false }, { n: 'Auto-Reparar', t: 'toggle', v: false }
    ]}
  ];

  const MAX_VISIBLE = 12;
  let catIdx = 0, cursor = 0, scroll = 0;
  const VERSION = 'v3.0.3';

  function badgeHTML(it) {
    if (it.t === 'toggle') {
      return '<span class="val ' + (it.v ? 'badge-on' : 'badge-off') + '">' + (it.v ? '[ON]' : '[OFF]') + '</span>';
    }
    if (it.t === 'cycle') {
      return '<span class="val badge-cycle">&lt; ' + it.o[it.idx - 1] + ' &gt;</span>';
    }
    return '<span class="val badge-go">&gt;&gt;</span>';
  }

  function iconHTML(it) {
    return it.i ? '<img class="wicon" src="assets/weapons/weapon_' + it.i + '.png">' : '';
  }

  function dotsHTML(pages, cur) {
    let h = '';
    for (let i = 0; i < pages; i++) h += '<span class="' + (cur === i ? 'on' : '') + '"></span>';
    return '<div class="dots">' + h + '</div>';
  }

  function render() {
    const cat = CATS[catIdx];
    const stage = document.getElementById('stage');

    const show = cat.items.slice(scroll, scroll + MAX_VISIBLE);
    let rows = '';
    for (let i = 0; i < show.length; i++) {
      const gi = scroll + i;
      rows += '<div class="mrow' + (gi === cursor ? ' sel' : '') + '">'
            + iconHTML(cat.items[gi])
            + '<span class="lab">' + cat.items[gi].n + '</span>'
            + badgeHTML(cat.items[gi]) + '</div>';
    }

    stage.innerHTML =
      '<div class="menu">'
      + '<img class="banner" src="assets/banner.png">'
      + '<div class="sub"><span class="name">' + cat.name.toUpperCase() + '</span>'
      + dotsHTML(CATS.length, catIdx) + '</div>'
      + '<div class="mitems">' + rows + '</div>'
      + '<div class="mfoot"><span>SETAS: pagina/item - ENTER: ativar - BACKSPACE: fechar</span>'
      + '<span>' + cat.items.length + ' ITEM(S)' + (scroll + MAX_VISIBLE < cat.items.length ? '  v' : '') + '</span></div>'
      + '</div>';
  }

  document.addEventListener('keydown', function (e) {
    const cat = CATS[catIdx];
    if (e.key === 'ArrowRight') { catIdx = (catIdx + 1) % CATS.length; cursor = 0; scroll = 0; }
    else if (e.key === 'ArrowLeft') { catIdx = (catIdx - 1 + CATS.length) % CATS.length; cursor = 0; scroll = 0; }
    else if (e.key === 'ArrowDown') {
      cursor = (cursor + 1) % cat.items.length;
      if (cursor >= scroll + MAX_VISIBLE) scroll = cursor - MAX_VISIBLE + 1;
    }
    else if (e.key === 'ArrowUp') {
      cursor = (cursor - 1 + cat.items.length) % cat.items.length;
      if (cursor < scroll) scroll = cursor;
    }
    else if (e.key === 'Enter') {
      const it = cat.items[cursor];
      if (it.t === 'toggle') it.v = !it.v;
      else if (it.t === 'cycle') {
        const total = it.o.length;
        it.idx = (it.idx % total) + 1;
      }
    }
    render();
  });

  render();
</script>
</body>
</html>
