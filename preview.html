<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyper Menu - Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(ellipse at center, #12151d 0%, #05070c 100%);
    color: #fff;
    overflow: hidden;
    user-select: none;
  }
  #hint {
    position: fixed; top: 14px; left: 0; right: 0; text-align: center;
    font-size: 13px; color: #8aa0b8; letter-spacing: 1px;
  }
  #stage { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 10vh; }

  .menu {
    width: 600px;
    background: rgba(5, 8, 16, 0.94);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.5), 0 18px 60px rgba(0,0,0,0.7);
  }

  .mhead {
    background: rgba(9, 12, 22, 0.97);
    padding: 9px 16px 10px;
    position: relative;
    border-bottom: 3px solid transparent;
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { border-color: rgba(56,189,248,0.45); }
    50%      { border-color: rgba(56,189,248,0.98); }
  }
  .mhead .t { font-size: 24px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; }
  .mhead .sub { font-size: 11.5px; color: #a5b4c8; letter-spacing: 2px; margin-top: 1px; }
  .mhead .ver { position: absolute; right: 14px; top: 11px; font-size: 11px; color: #6e7f96; }

  .mwrap { display: flex; }

  .mpanel {
    width: 176px;
    background: rgba(8, 11, 20, 0.92);
  }
  .mcat {
    height: 32px; display: flex; align-items: center;
    padding: 0 14px; position: relative; margin: 3px 6px;
    border-radius: 10px;
    font-size: 13.5px;
  }
  .mcat.sel {
    background: rgba(56, 189, 248, 0.22);
    color: #fff; font-weight: 700;
  }
  .mcat.sel::before {
    content: ''; position: absolute; left: -6px; top: 25%; bottom: 25%; width: 3px; border-radius: 2px; background: #38bdf8;
  }
  .mcat .arr { margin-left: auto; color: #3c4a5e; font-size: 11px; }
  .mcat.sel .arr { color: #38bdf8; }

  .msep { width: 2px; background: rgba(56,189,248,0.18); }

  .mitems { flex: 1; padding: 4px; }
  .mrow {
    height: 34px; display: flex; align-items: center;
    padding: 0 12px; position: relative; margin: 1px 0;
    border-radius: 10px;
    font-size: 14px; color: #cdd6e1;
  }
  .mrow.sel {
    background: rgba(56,189,248,0.33);
    color: #fff;
    box-shadow: 0 0 14px rgba(56,189,248,0.35), 0 0 0 1px rgba(56,189,248,0.25);
  }
  .mrow .lab { flex: 1; white-space: nowrap; overflow: hidden; }
  .mrow .val { font-size: 12px; text-align: right; }
  .wicon { width: 26px; height: 26px; margin-right: 10px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6)); }

  .badge-on  { color: #34d399; }
  .badge-off { color: #8c96aa; }
  .badge-cycle { color: #78b4ff; }
  .badge-go  { color: #cdd6e1; }

  .mfoot {
    display: flex; justify-content: space-between;
    background: rgba(6, 9, 17, 0.96);
    padding: 6px 14px 8px;
    font-size: 11px; color: #8292a8; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div id="hint">PREVIEW - setas: esquerda/direita trocam categoria, cima/baixo rolam, ENTER ativa</div>
  <div id="stage"></div>

<script>
  const CATS = [
    { name: 'Locais', items: [
      { n: 'Godmode', t: 'toggle', v: false }, { n: 'Invisivel', t: 'toggle', v: false },
      { n: 'Sem Ragdoll', t: 'toggle', v: false }, { n: 'Stamina Infinita', t: 'toggle', v: false },
      { n: 'Super Velocidade', t: 'toggle', v: false }, { n: 'Curar', t: 'action' },
      { n: 'Colete', t: 'action' }, { n: 'Limpar Visual', t: 'action' }
    ]},
    { name: 'Arma', items: [
      { n: 'Municao Infinita', t: 'toggle', v: false }, { n: 'Municao Explosiva', t: 'toggle', v: false },
      { n: 'Municao Incendiaria', t: 'toggle', v: false }, { n: 'Pistola', t: 'action', i: 'pistol' },
      { n: 'SMG', t: 'action', i: 'smg' }, { n: 'Fuzil de Assalto', t: 'action', i: 'assaultrifle' },
      { n: 'Sniper', t: 'action', i: 'sniperrifle' }, { n: 'RPG', t: 'action', i: 'rpg' },
      { n: 'Todas as Armas', t: 'action', i: 'carbinerifle' }, { n: 'Remover Armas', t: 'action' }
    ]},
    { name: 'Veiculo', items: [
      { n: 'Reparar', t: 'action' }, { n: 'Ligar Motor', t: 'action' }, { n: 'Pneus Blindados', t: 'toggle', v: false },
      { n: 'Tuning Maximo', t: 'action' }, { n: 'Lavar', t: 'action' }, { n: 'Velocidade Maxima', t: 'toggle', v: false },
      { n: 'Apagar Veiculo', t: 'action' }, { n: 'Spawnar Veiculo', t: 'list' }
    ]},
    { name: 'Teleporte', items: [
      { n: 'Teleporte ao Waypoint', t: 'action' }, { n: 'Hotspots', t: 'list' },
      { n: 'Para o Jogador mais Proximo', t: 'action' }
    ]},
    { name: 'Visual', items: [
      { n: 'Tempo', t: 'cycle', o: ['Ensolarado', 'Limpo', 'Nublado', 'Chuva', 'Nevoeiro', 'Tempestade', 'Neve'], idx: 1 },
      { n: 'Horario', t: 'cycle', o: ['Manha', 'Tarde', 'Entardecer', 'Noite', 'Madrugada'], idx: 3 },
      { n: 'Congelar Tempo', t: 'toggle', v: false }
    ]},
    { name: 'Jogadores', items: [
      { n: 'Todos: Matar', t: 'action' }, { n: 'Todos: Explodir', t: 'action' }, { n: 'Todos: Para Mim', t: 'action' },
      { n: 'Lista de Jogadores', t: 'list' }
    ]},
    { name: 'Diversos', items: [
      { n: 'Aimbot (assistir)', t: 'toggle', v: false }, { n: 'Auto-Reparar', t: 'toggle', v: false }
    ]}
  ];

  const MAX_VISIBLE = 12;
  let catIdx = 0, cursor = 0, scroll = 0;
  const VERSION = 'v3.0.2';

  function badgeHTML(it) {
    if (it.t === 'toggle') {
      return '<span class="val ' + (it.v ? 'badge-on' : 'badge-off') + '">' + (it.v ? '[ON]' : '[OFF]') + '</span>';
    }
    if (it.t === 'cycle') {
      return '<span class="val badge-cycle">&lt; ' + it.o[it.idx - 1] + ' &gt;</span>';
    }
    return '<span class="val badge-go">&gt;&gt;</span>';
  }

  function iconHTML(it) {
    return it.i ? '<img class="wicon" src="assets/weapons/weapon_' + it.i + '.png">' : '';
  }

  function render() {
    const cat = CATS[catIdx];
    const stage = document.getElementById('stage');

    let cats = '';
    for (let i = 0; i < CATS.length; i++) {
      cats += '<div class="mcat' + (i === catIdx ? ' sel' : '') + '">' + CATS[i].name
            + '<span class="arr">' + (i === catIdx ? '&gt;' : '&gt;&gt;') + '</span></div>';
    }

    const show = cat.items.slice(scroll, scroll + MAX_VISIBLE);
    let rows = '';
    for (let i = 0; i < show.length; i++) {
      const gi = scroll + i;
      rows += '<div class="mrow' + (gi === cursor ? ' sel' : '') + '">'
            + iconHTML(cat.items[gi])
            + '<span class="lab">' + cat.items[gi].n + '</span>'
            + badgeHTML(cat.items[gi]) + '</div>';
    }

    stage.innerHTML =
      '<div class="menu">'
      + '<div class="mhead"><div class="t">HYPER MENU</div>'
      + '<div class="sub">' + cat.name.toUpperCase() + '</div>'
      + '<div class="ver">' + VERSION + '</div></div>'
      + '<div class="mwrap"><div class="mpanel">' + cats + '</div>'
      + '<div class="msep"></div><div class="mitems">' + rows + '</div></div>'
      + '<div class="mfoot"><span>SETAS / ENTER / BACKSPACE</span>'
      + '<span>' + cat.items.length + ' ITEM(S)' + (scroll + MAX_VISIBLE < cat.items.length ? '  v' : '') + '</span></div>'
      + '</div>';
  }

  document.addEventListener('keydown', function (e) {
    const cat = CATS[catIdx];
    if (e.key === 'ArrowRight') { catIdx = (catIdx + 1) % CATS.length; cursor = 0; scroll = 0; }
    else if (e.key === 'ArrowLeft') { catIdx = (catIdx - 1 + CATS.length) % CATS.length; cursor = 0; scroll = 0; }
    else if (e.key === 'ArrowDown') {
      cursor = (cursor + 1) % cat.items.length;
      if (cursor >= scroll + MAX_VISIBLE) scroll = cursor - MAX_VISIBLE + 1;
    }
    else if (e.key === 'ArrowUp') {
      cursor = (cursor - 1 + cat.items.length) % cat.items.length;
      if (cursor < scroll) scroll = cursor;
    }
    else if (e.key === 'Enter') {
      const it = cat.items[cursor];
      if (it.t === 'toggle') it.v = !it.v;
      else if (it.t === 'cycle') {
        const total = it.o.length;
        it.idx = (it.idx % total) + 1;
      }
    }
    render();
  });

  render();
</script>
</body>
</html>
